<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuyMeSoda Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background:#f8fafc; }
    .admin { max-width:1200px; margin:0 auto; padding:30px 20px 60px; }
    .admin-login { max-width:420px; margin:80px auto; background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:28px; box-shadow:0 12px 35px rgba(15,23,42,.08); }
    .admin-login h1 { margin-top:0; }
    .admin-dashboard { display:none; }
    .admin-top { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:24px; }
    .admin-top h1 { margin:0; }
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; margin-bottom:24px; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:20px; box-shadow:0 8px 30px rgba(15,23,42,.05); }
    .stat-label { color:#64748b; font-size:.88rem; }
    .stat-value { margin-top:8px; font-size:1.9rem; font-weight:800; }
    .grid { display:grid; grid-template-columns:1.2fr 1fr; gap:20px; }
    table { width:100%; border-collapse:collapse; }
    th,td { text-align:left; padding:11px 8px; border-bottom:1px solid #e2e8f0; font-size:.9rem; }
    th { color:#475569; }
    .table-wrap { overflow-x:auto; }
    .activity { max-height:430px; overflow:auto; }
    .activity-row { padding:11px 0; border-bottom:1px solid #e2e8f0; }
    .activity-row small { display:block; color:#64748b; margin-top:3px; }
    .btn-admin { border:0; padding:10px 16px; border-radius:10px; cursor:pointer; }
    #loginError { color:#dc2626; min-height:20px; margin:8px 0; }
    @media(max-width:900px){.grid{grid-template-columns:1fr;} .admin-top{align-items:flex-start; flex-direction:column;}}
  </style>
</head>
<body>
  <div id="loginPanel" class="admin-login">
    <h1>Admin Control Panel</h1>
    <p>Sign in to manage BuyMeSoda.</p>
    <form id="adminLoginForm">
      <div class="form-group">
        <label class="form-label" for="adminPassword">Admin Password</label>
        <input class="form-input" id="adminPassword" type="password" required>
      </div>
      <div id="loginError"></div>
      <button class="btn btn-primary btn-admin" type="submit">Sign In</button>
    </form>
  </div>

  <main id="adminDashboard" class="admin admin-dashboard">
    <div class="admin-top">
      <div><h1>Admin Control Panel</h1><p>Platform health, users and activity.</p></div>
      <button id="logoutBtn" class="btn btn-login btn-admin">Log Out</button>
    </div>

    <section class="stats-grid">
      <div class="card"><div class="stat-label">Total Users</div><div class="stat-value" id="totalUsers">0</div></div>
      <div class="card"><div class="stat-label">New Today</div><div class="stat-value" id="newToday">0</div></div>
      <div class="card"><div class="stat-label">Views Today</div><div class="stat-value" id="viewsToday">0</div></div>
      <div class="card"><div class="stat-label">Creator Views</div><div class="stat-value" id="creatorViewsToday">0</div></div>
      <div class="card"><div class="stat-label">QR Views</div><div class="stat-value" id="qrViewsToday">0</div></div>
      <div class="card"><div class="stat-label">Soda Clicks</div><div class="stat-value" id="sodaClicksToday">0</div></div>
    </section>

    <section class="grid">
      <div class="card">
        <h2>Recent Users</h2>
        <div class="table-wrap"><table><thead><tr><th>Name</th><th>Username</th><th>Email</th><th>Status</th></tr></thead><tbody id="usersTable"></tbody></table></div>
      </div>
      <div class="card">
        <h2>Recent Activity</h2>
        <div id="activityList" class="activity"></div>
      </div>
    </section>
  </main>

<script>
async function adminRequest(path, options = {}) {
  const response = await fetch(path, { credentials: 'same-origin', ...options });
  let data = {};
  try { data = await response.json(); } catch (_) {}
  if (!response.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function renderStats(data) {
  for (const id of ['totalUsers','newToday','viewsToday','creatorViewsToday','qrViewsToday','sodaClicksToday']) {
    const el = document.getElementById(id); if (el) el.textContent = data[id] ?? 0;
  }
  document.getElementById('usersTable').innerHTML = data.latestUsers.map(user => `<tr><td>${escapeHtml(user.name)}</td><td>@${escapeHtml(user.username)}</td><td>${escapeHtml(user.email)}</td><td>${user.isSuspended ? 'Suspended' : 'Active'}</td></tr>`).join('');
  document.getElementById('activityList').innerHTML = data.recentEvents.map(event => `<div class="activity-row"><strong>${escapeHtml(event.type.replaceAll('_',' '))}</strong>${event.username ? ` · @${escapeHtml(event.username)}` : ''}<small>${new Date(event.createdAt).toLocaleString()} · ${escapeHtml(event.path)}</small></div>`).join('');
}
function escapeHtml(value) { return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
async function loadDashboard() {
  const data = await adminRequest('/api/admin/stats');
  document.getElementById('loginPanel').style.display = 'none';
  document.getElementById('adminDashboard').style.display = 'block';
  renderStats(data);
}

document.getElementById('adminLoginForm').addEventListener('submit', async event => {
  event.preventDefault();
  const error = document.getElementById('loginError'); error.textContent = '';
  try { await adminRequest('/api/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:document.getElementById('adminPassword').value}) }); await loadDashboard(); }
  catch (e) { error.textContent = e.message || 'Invalid password'; }
});

document.getElementById('logoutBtn').addEventListener('click', async () => { await adminRequest('/api/admin/logout', { method:'POST' }).catch(()=>{}); location.reload(); });

loadDashboard().catch(() => {});
</script>
</body>
</html>
