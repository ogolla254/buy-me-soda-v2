<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator Dashboard - Buy Me a Soda 🥤</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background:#f8fafc; }
    .dashboard { max-width:1100px; margin:0 auto; padding:30px 20px 60px; }
    .dashboard-top { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:24px; }
    .dashboard-top h1 { margin:0; }
    .dashboard-actions { display:flex; gap:10px; flex-wrap:wrap; }
    .dashboard-actions a,.dashboard-actions button { border:0; text-decoration:none; cursor:pointer; }
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; margin-bottom:24px; }
    .stat-card,.panel { background:#fff; border:1px solid #e2e8f0; border-radius:16px; box-shadow:0 8px 30px rgba(15,23,42,.05); }
    .stat-card { padding:22px; }
    .stat-card span { display:block; color:#64748b; font-size:.9rem; margin-bottom:8px; }
    .stat-card strong { font-size:2rem; color:#0f172a; }
    .layout { display:grid; grid-template-columns:2fr 1fr; gap:20px; }
    .panel { padding:24px; }
    .profile-head { display:flex; align-items:center; gap:18px; margin-bottom:20px; }
    .profile-head img { width:82px; height:82px; border-radius:50%; object-fit:cover; border:3px solid #e2e8f0; }
    .profile-head h2 { margin:0 0 4px; }
    .muted { color:#64748b; }
    .activity-item { display:flex; justify-content:space-between; gap:16px; padding:12px 0; border-bottom:1px solid #e2e8f0; }
    .activity-item:last-child { border-bottom:0; }
    .activity-item span { color:#64748b; font-size:.85rem; text-align:right; }
    @media(max-width:800px){ .layout{grid-template-columns:1fr;} .dashboard-top{align-items:flex-start; flex-direction:column;} }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-logo"><a href="index.html" class="nav-logo-link"><h2>Buy Me a Soda 🥤</h2></a></div>
      <div class="nav-links"><a href="#" id="dashboardLogout" class="btn btn-login">Log Out</a></div>
    </div>
  </nav>

  <main class="dashboard">
    <div class="dashboard-top">
      <div>
        <h1>Creator Dashboard</h1>
        <div id="dashboardUsername" class="muted">Loading...</div>
      </div>
      <div class="dashboard-actions">
        <a id="publicProfileLink" href="#" class="btn btn-secondary">View Public Page</a>
        <a href="qr.html" class="btn btn-primary">My QR Code</a>
      </div>
    </div>

    <section class="stats-grid">
      <div class="stat-card"><span>Profile Views</span><strong id="profileViews">0</strong></div>
      <div class="stat-card"><span>Sodas Clicked</span><strong id="sodas">0</strong></div>
      <div class="stat-card"><span>Transactions Recorded</span><strong id="transactions">0</strong></div>
    </section>

    <section class="layout">
      <div class="panel">
        <div class="profile-head">
          <img id="dashboardImage" src="https://ui-avatars.com/api/?name=Creator&rounded=true" alt="Creator profile">
          <div><h2 id="dashboardName">Loading...</h2><div class="muted">Creator account</div></div>
        </div>
        <h3>About</h3>
        <p id="dashboardBio" class="muted">Loading...</p>
        <h3>Support Link</h3>
        <p id="dashboardPaypalMe" class="muted">Loading...</p>
      </div>

      <div class="panel">
        <h3>Recent Activity</h3>
        <div id="activityList"><p class="muted">Loading...</p></div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = UserSession.getCurrentUser();
      const link = document.getElementById('publicProfileLink');
      if (user && link) link.href = `/${user.username}`;
    });
  </script>
</body>
</html>
