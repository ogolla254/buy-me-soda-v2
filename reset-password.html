<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create New Password - Buy Me a Soda 🥤</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .reset-wrap{min-height:75vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}.reset-card{width:min(460px,100%);background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:28px;box-shadow:0 12px 35px rgba(15,23,42,.08)}.reset-card h1{margin-top:0}.reset-card p{color:#64748b;line-height:1.6}.reset-card label{display:block;font-weight:600;margin:14px 0 7px}.reset-card input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.reset-card button{width:100%;border:0;cursor:pointer;margin-top:18px}.hidden{display:none}.step{margin-top:12px}
  </style>
</head>
<body>
  <div class="reset-wrap"><div class="reset-card">
    <h1>Create a new password</h1>
    <p>Enter the email and 6-digit code from your reset email.</p>
    <form id="resetForm">
      <label for="resetEmail">Email address</label><input id="resetEmail" type="email" required autocomplete="email">
      <label for="resetCode">6-digit code</label><input id="resetCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code">
      <label for="newPassword">New password</label><input id="newPassword" type="password" minlength="8" required autocomplete="new-password">
      <label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password">
      <button class="btn btn-primary" type="submit">Reset password</button>
    </form>
    <div class="step"><a href="login.html">Back to sign in</a></div>
  </div></div>
  <script src="script.js"></script>
</body>
</html>
