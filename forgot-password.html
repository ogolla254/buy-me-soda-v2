<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Buy Me a Soda 🥤</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .reset-wrap{min-height:75vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
    .reset-card{width:min(460px,100%);background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:28px;box-shadow:0 12px 35px rgba(15,23,42,.08)}
    .reset-card h1{margin-top:0}.reset-card p{color:#64748b;line-height:1.6}.reset-card label{display:block;font-weight:600;margin:14px 0 7px}.reset-card input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.reset-card button{margin-top:18px;width:100%;border:0;cursor:pointer}.back-link{display:inline-block;margin-top:18px}
  </style>
</head>
<body>
  <div class="reset-wrap"><div class="reset-card">
    <h1>Reset your password</h1>
    <p>Enter your account email. We’ll send a 6-digit code that expires in 10 minutes.</p>
    <form id="forgotForm">
      <label for="resetEmail">Email address</label>
      <input id="resetEmail" type="email" required autocomplete="email" placeholder="you@example.com">
      <button class="btn btn-primary" type="submit">Send reset code</button>
    </form>
    <a class="back-link" href="login.html">Back to sign in</a>
  </div></div>
  <script src="script.js"></script>
</body>
</html>
